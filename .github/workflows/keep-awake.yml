# Keeps the free Render server awake during demo week, so nobody waits ~50s for it to wake up.
# Render's free plan sleeps after 15 minutes without visitors; a request every few minutes prevents that.
# Runs Sept 24-26 (UTC) only, to stay well inside GitHub's free Actions minutes. Delete this file to stop it.
name: Keep Riptide awake

on:
  schedule:
    - cron: '*/6 * 24-26 9 *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health check (retries while it wakes up)
        run: curl -fsS --retry 6 --retry-delay 15 --retry-all-errors --max-time 90 https://riptide-i0pk.onrender.com/api/health
